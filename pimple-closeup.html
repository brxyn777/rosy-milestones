<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pimple Close-Up</title>
<style>
  /* Layout: one 9:16 frame centered on a quiet backdrop; nothing else on screen */
  :root {
    --backdrop: #0f1b2b;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--backdrop);
    display: grid; place-items: center;
    overflow: hidden;
  }
  #reel {
    display: block;
    height: 100%; max-height: 100%;
    width: auto; max-width: 100%;
    aspect-ratio: 9 / 16;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="reel" width="1080" height="1920" aria-label="Close-up of skin texture where hollow blue pimples swell up and bulge the pores around them"></canvas>
<script>
(() => {
  // ---- reel settings ----
  const W = 1080, H = 1920, FPS = 60;
  const TOTAL_SECONDS = 10;
  const SWELL = 0.42;               // seconds for a pimple to pop up
  const TENSE = 0.16;               // skin tightens just before
  const SEED = 21;
  const BLUE = '#2a63d8';

  const canvas = document.getElementById('reel');
  const ctx = canvas.getContext('2d');
  const halo = document.createElement('canvas');
  const HS = 0.25;
  halo.width = W * HS; halo.height = H * HS;
  const hctx = halo.getContext('2d');

  let rng;
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const backOut = u => { const c1 = 2.6, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };

  // ---- skin: creases, pores and a few fine hairs (built once, deterministic) ----
  let creases, pores, hairs, pimples;
  function buildSkin() {
    rng = mulberry(SEED);
    const S = 92, cols = 16, rows = 26, x0 = -170, y0 = -230;
    const pts = [];
    for (let j = 0; j < rows; j++) {
      pts.push([]);
      for (let i = 0; i < cols; i++) {
        pts[j].push([x0 + i * S + (j % 2) * S / 2 + (rng() - 0.5) * S * 0.55, y0 + j * S * 0.866 + (rng() - 0.5) * S * 0.55]);
      }
    }
    creases = []; pores = []; hairs = [];
    const edge = (a, b) => {
      if (rng() < 0.22) return; // gaps keep the crease net irregular
      const line = [], bend = (rng() - 0.5) * 14;
      const nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.hypot(nx, ny) || 1;
      for (let k = 0; k <= 6; k++) {
        const u = k / 6, w = Math.sin(Math.PI * u) * bend;
        line.push([a[0] + (b[0] - a[0]) * u + nx / nl * w, a[1] + (b[1] - a[1]) * u + ny / nl * w]);
      }
      creases.push(line);
    };
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const p = pts[j][i];
      if (i + 1 < cols) edge(p, pts[j][i + 1]);
      if (j + 1 < rows) {
        const off = j % 2;
        edge(p, pts[j + 1][i]);
        if (i + (off ? 1 : -1) >= 0 && i + (off ? 1 : -1) < cols) edge(p, pts[j + 1][i + (off ? 1 : -1)]);
      }
      if (rng() < 0.42) {
        const pr = 4.5 + rng() * 5;
        pores.push({ x: p[0], y: p[1], r: pr });
        if (rng() < 0.08) {
          const a = -2.2 + rng() * 0.8, L = 70 + rng() * 70, curl = (rng() - 0.5) * 0.9, line = [];
          for (let k = 0; k <= 10; k++) {
            const u = k / 10, ang = a + curl * u;
            line.push(k ? [line[k - 1][0] + Math.cos(ang) * L / 10, line[k - 1][1] + Math.sin(ang) * L / 10] : [p[0], p[1]]);
          }
          hairs.push(line);
        }
      }
    }

    // pimples: one hero first, then more come faster
    pimples = [];
    const plan = [[0.9, 175], [2.0, 120], [2.8, 140], [3.5, 95], [4.1, 125], [4.6, 80], [5.0, 105], [5.4, 70], [5.75, 90], [6.1, 75], [6.4, 60], [6.7, 85], [7.0, 65], [7.25, 55]];
    for (const [t0, R] of plan) {
      for (let tries = 0; tries < 200; tries++) {
        const x = pimples.length ? 120 + rng() * (W - 240) : W * 0.52;
        const y = pimples.length ? 260 + rng() * (H - 520) : H * 0.50;
        if (pimples.every(p => Math.hypot(p.x - x, p.y - y) > (p.R + R) * 1.12)) {
          pimples.push({ x, y, R, t0, tilt: rng() * 0.6 - 0.3 }); break;
        }
      }
    }
  }

  // how far each pimple has swelled at time t (can dip slightly negative while the skin tightens)
  function swell(p, t) {
    const a = t - p.t0;
    if (a < -TENSE) return 0;
    if (a < 0) return -0.06 * Math.sin(Math.PI * (a + TENSE) / TENSE);
    const u = a / SWELL;
    return u >= 1 ? 1 : backOut(u);
  }

  // bulge: skin near a dome is pushed outward and magnified
  function warp(x, y, live) {
    let mag = 1;
    for (const { p, s } of live) {
      const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy) || 1e-6, R = p.R;
      const g = Math.exp(-(d * d) / (R * R * 1.1));
      const push = s * R * 0.42 * g * (1 - Math.exp(-(d * d) / (R * R * 0.08)));
      x += dx / d * push; y += dy / d * push;
      mag *= 1 + 0.55 * s * g;
    }
    return [x, y, mag];
  }

  let frame;
  function reset() { buildSkin(); frame = 0; }
  function step() { frame++; }
  const done = () => frame >= TOTAL_SECONDS * FPS;

  // ---- drawing ----
  const blobs = [
    { x: 0.18, y: 0.14, r: 0.55, a: 0.55 }, { x: 0.86, y: 0.32, r: 0.45, a: 0.45 },
    { x: 0.30, y: 0.62, r: 0.50, a: 0.40 }, { x: 0.78, y: 0.86, r: 0.55, a: 0.50 },
    { x: 0.52, y: 0.42, r: 0.35, a: 0.35 },
  ];
  function background(t) {
    const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, '#e4f0fc'); g.addColorStop(0.55, '#cfe3f7'); g.addColorStop(1, '#bcd6f1');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    blobs.forEach((b, i) => {
      const k = t * 0.18 + i * 1.7;
      const x = (b.x + 0.04 * Math.sin(k)) * W, y = (b.y + 0.03 * Math.cos(k * 0.8)) * H;
      const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r * W);
      rg.addColorStop(0, `rgba(255,255,255,${b.a})`); rg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
    });
  }

  function draw() {
    const t = frame / FPS;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    background(t);

    // slow drift and push-in, like a handheld macro lens
    const z = 1.02 + 0.07 * ease(clamp(t / TOTAL_SECONDS, 0, 1));
    const cx = W / 2 + 18 * Math.sin(t * 0.35), cy = H / 2 + 24 * Math.cos(t * 0.28);
    const view = (g, k = 1) => g.setTransform(z * k, 0, 0, z * k, (W / 2 - cx * z) * k, (H / 2 - cy * z) * k);

    const live = pimples.map(p => ({ p, s: swell(p, t) })).filter(o => o.s !== 0);

    // glow behind the pimples
    hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, halo.width, halo.height);
    view(hctx, HS);
    hctx.fillStyle = '#fff';
    for (const { p, s } of live) if (s > 0) { hctx.beginPath(); hctx.arc(p.x, p.y, p.R * s * 1.15 + 24, 0, 6.2832); hctx.fill(); }
    ctx.save(); ctx.globalAlpha = 0.9; ctx.filter = 'blur(16px)'; ctx.drawImage(halo, 0, 0, W, H); ctx.restore();

    view(ctx);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // creases
    ctx.strokeStyle = 'rgba(42, 99, 216, 0.38)';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (const line of creases) line.forEach(([x, y], k) => { const w = warp(x, y, live); k ? ctx.lineTo(w[0], w[1]) : ctx.moveTo(w[0], w[1]); });
    ctx.stroke();

    // fine hairs
    ctx.strokeStyle = 'rgba(42, 99, 216, 0.7)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (const line of hairs) line.forEach(([x, y], k) => { const w = warp(x, y, live); k ? ctx.lineTo(w[0], w[1]) : ctx.moveTo(w[0], w[1]); });
    ctx.stroke();

    // pores, magnified where the skin bulges
    ctx.strokeStyle = BLUE; ctx.lineWidth = 2.8;
    ctx.beginPath();
    for (const q of pores) {
      const [x, y, m] = warp(q.x, q.y, live), r = q.r * m;
      ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, 6.2832);
    }
    ctx.stroke();

    // pimples: hollow dome with contour rings, a whitehead, and a ripple on the pop
    for (const { p, s } of live) {
      const a = t - p.t0;
      if (s < 0) {
        // skin tightening: a small ring draws in
        ctx.strokeStyle = `rgba(42, 99, 216, ${-s / 0.06 * 0.6})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.R * 0.18, 0, 6.2832); ctx.stroke();
        continue;
      }
      const R = p.R * s;
      if (a > 0 && a < 0.6) {
        const u = a / 0.6;
        ctx.strokeStyle = `rgba(42, 99, 216, ${0.4 * (1 - u)})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.R * (1.05 + 0.9 * ease(u)), 0, 6.2832); ctx.stroke();
      }
      const dome = ctx.createRadialGradient(p.x - 0.25 * R, p.y - 0.3 * R, 0, p.x, p.y, Math.max(1, R));
      dome.addColorStop(0, 'rgba(255,255,255,0.85)'); dome.addColorStop(0.75, 'rgba(240,247,255,0.6)'); dome.addColorStop(1, 'rgba(42,99,216,0.12)');
      ctx.fillStyle = dome;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, R), 0, 6.2832); ctx.fill();
      // contours lean toward the top-left to read as a raised dome
      const hx = -0.16 * R, hy = -0.2 * R;
      ctx.strokeStyle = 'rgba(42, 99, 216, 0.45)'; ctx.lineWidth = 2.6;
      for (const k of [0.72, 0.46]) {
        ctx.beginPath(); ctx.ellipse(p.x + hx * (1 - k), p.y + hy * (1 - k), R * k, R * k * 0.96, p.tilt, 0, 6.2832); ctx.stroke();
      }
      ctx.strokeStyle = BLUE; ctx.lineWidth = Math.max(4, p.R * 0.045);
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, R), 0, 6.2832); ctx.stroke();
      // whitehead
      const wr = R * 0.17;
      ctx.lineWidth = Math.max(3, p.R * 0.035);
      ctx.beginPath(); ctx.arc(p.x + hx * 0.75, p.y + hy * 0.75, Math.max(1, wr), 0, 6.2832); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(p.x + hx * 0.75, p.y + hy * 0.75, Math.max(0.5, wr - ctx.lineWidth / 2), 0, 6.2832); ctx.fill();
    }

    // gentle edge falloff and fade-in
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const vg = ctx.createRadialGradient(W / 2, H / 2, W * 0.45, W / 2, H / 2, H * 0.62);
    vg.addColorStop(0, 'rgba(90,140,200,0)'); vg.addColorStop(1, 'rgba(90,140,200,0.18)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    const fin = clamp(t / 0.5, 0, 1);
    if (fin < 1) { ctx.fillStyle = `rgba(220,235,250,${1 - ease(fin)})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---- hooks for the offline renderer ----
  window.reel = {
    W, H, FPS,
    reset() { reset(); draw(); },
    renderFrame() { step(); draw(); return done(); },
  };

  // ---- live preview: plays on a loop; click to restart ----
  if (!new URLSearchParams(location.search).has('render')) {
    reset();
    let acc = 0, last = performance.now();
    const loop = now => {
      acc += Math.min(0.1, (now - last) / 1000); last = now;
      let n = 0;
      while (acc >= 1 / FPS && n < 3) { step(); acc -= 1 / FPS; n++; }
      if (n) draw();
      if (done()) reset();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    canvas.addEventListener('click', () => reset());
  }
})();
</script>
</body>
</html>
